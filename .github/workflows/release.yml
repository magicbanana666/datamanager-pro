# Publishes a release when a version tag is pushed (git tag v0.2.0 &&
# git push origin v0.2.0): the NSIS and MSI installers, the signed
# updater artifacts plus latest.json (what the in-app updater checks),
# and the portable zip.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the contents of
# ~/.tauri/datamanager-pro.key) and, if the key has one,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD. Code signing (Authenticode) is not
# configured - see PHASE10.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DataManager Pro ${{ github.ref_name }}
          releaseBody: See the commits since the previous release.
          releaseDraft: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json
      - name: Portable zip
        shell: pwsh
        run: |
          ./scripts/build-portable.ps1 -SkipBuild
          gh release upload "${{ github.ref_name }}" (Get-ChildItem builds/*-portable.zip).FullName --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
